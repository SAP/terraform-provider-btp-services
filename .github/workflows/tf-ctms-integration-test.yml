name: CTMS Integration Test - Terraform Provider

on:
  workflow_dispatch:
  workflow_call:

env:
  PATH_TO_TFSCRIPT: "tests/integration_ctms"
  DEV_OVERRIDE: "assets/provider-config-ghaction.txt"

permissions:
  contents: read
  issues: write

jobs:
  integration-test-ctms:
    name: CTMS Integration Test with local provider
    runs-on: ubuntu-latest

    environment:
      name: btp-services

    concurrency:
      group: ctms-integration-btp-services
      cancel-in-progress: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

        env:
          BTP_CTMS_ENDPOINT: ${{ secrets.BTP_CTMS_ENDPOINT }}
          BTP_CTMS_TOKEN_URL: ${{ secrets.BTP_CTMS_TOKEN_URL }}
          BTP_CTMS_CLIENT_ID: ${{ secrets.BTP_CTMS_CLIENT_ID }}
          BTP_CTMS_CLIENT_SECRET: ${{ secrets.BTP_CTMS_CLIENT_SECRET }}

      - name: Build and install local provider
        run: go mod tidy && make install

      - name: Configure Terraform dev override
        run: |
          rm -rf ${{ env.PATH_TO_TFSCRIPT }}/.terraform
          rm -rf ${{ env.PATH_TO_TFSCRIPT }}/.terraform.lock.hcl
          cp ${{ env.DEV_OVERRIDE }} ~/.terraformrc

      - name: Terraform Plan
        id: plan
        run: |
          plan_exit=0
          terraform -chdir="$PATH_TO_TFSCRIPT" plan \
            -out=plan.tfplan \
            -no-color \
            -detailed-exitcode || plan_exit=$?
          echo "exitcode=$plan_exit" >> "$GITHUB_OUTPUT"
          case "$plan_exit" in
            0|2) ;;
            *) exit "$plan_exit" ;;
          esac
        env:
          BTP_CTMS_ENDPOINT: ${{ secrets.BTP_CTMS_ENDPOINT }}
          BTP_CTMS_TOKEN_URL: ${{ secrets.BTP_CTMS_TOKEN_URL }}
          BTP_CTMS_CLIENT_ID: ${{ secrets.BTP_CTMS_CLIENT_ID }}
          BTP_CTMS_CLIENT_SECRET: ${{ secrets.BTP_CTMS_CLIENT_SECRET }}

      - name: Terraform Apply
        id: apply
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        run: |
          terraform -chdir="$PATH_TO_TFSCRIPT" apply \
            -no-color \
            plan.tfplan
        env:
          BTP_CTMS_ENDPOINT: ${{ secrets.BTP_CTMS_ENDPOINT }}
          BTP_CTMS_TOKEN_URL: ${{ secrets.BTP_CTMS_TOKEN_URL }}
          BTP_CTMS_CLIENT_ID: ${{ secrets.BTP_CTMS_CLIENT_ID }}
          BTP_CTMS_CLIENT_SECRET: ${{ secrets.BTP_CTMS_CLIENT_SECRET }}

      - name: Terraform Destroy
        if: always()
        run: |
          for i in 1 2 3; do
            echo "Destroy attempt $i..."
            terraform -chdir=${{ env.PATH_TO_TFSCRIPT }} destroy \
              -auto-approve \
              -no-color && exit 0
            [ $i -lt 3 ] && sleep 10
          done
          exit 1
        env:
          BTP_CTMS_ENDPOINT: ${{ secrets.BTP_CTMS_ENDPOINT }}
          BTP_CTMS_TOKEN_URL: ${{ secrets.BTP_CTMS_TOKEN_URL }}
          BTP_CTMS_CLIENT_ID: ${{ secrets.BTP_CTMS_CLIENT_ID }}
          BTP_CTMS_CLIENT_SECRET: ${{ secrets.BTP_CTMS_CLIENT_SECRET }}
